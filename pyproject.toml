[project]
name = "models-open223-info"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# upper bound comes from BuildingMOTIF, which requires ">=3.11, <3.13"
requires-python = ">=3.12, <3.13"
dependencies = [
    "jupyter-book>=2.0.0",
    "jupyterlab>=4.2.5",
    "nbformat>=5.10.4",
    "pyontoenv>=0.6.1",
    "pyshifty>=0.3.0",
    "rdflib>=7.0.0",
    "buildingmotif",
    "sphinxcontrib-mermaid>=0.9.2",
    "toml>=0.10.2",
    "ipykernel>=6.30.0",
    "myst-nb>=1.3.0",
]

[tool.uv.sources]
# the gtf-buildingmotif branch validates with pyshifty and resolves dependencies
# with ontoenv 0.6, so no Java/TopQuadrant is needed
buildingmotif = { git = "https://github.com/NREL/buildingmotif.git", rev = "gtf-buildingmotif" }
