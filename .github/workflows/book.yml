# https://github.com/executablebooks/github-action-demo/blob/master/.github/workflows/book.yml
name: deploy-book

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Fix timestamps
    - name: restore timestamps
      uses: chetan/git-restore-mtime-action@v2
    #- name: Restore file modification times
    #  run: |
    #    git ls-files -z models tools/compile.py | while IFS= read -r -d '' f; do
    #      ts="$(git log -1 --format='%at' -- "$f")"
    #      if [ -n "$ts" ]; then
    #        touch -d "@$ts" "$f"
    #      fi
    #    done

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # The model URL in examples/*.md is generated; only the published one may be
    # committed. Fails fast if a branch URL was checked in by mistake.
    - name: check committed model URLs
      run: make check-model-urls

    # Every build -- main included -- validates the commit it is building, read
    # from raw.githubusercontent.com. Pointing main at https://models.open223.info
    # instead would deadlock: that copy is whatever the last successful deploy
    # left behind, so a commit that fixes a bad model file gets validated against
    # the old bad file and can never go green. See tools/model-base-url.sh.
    - name: build examples
      env:
        BUILD_EXAMPLES_LOG: build-examples.log
        # For a pull request the head commit lives in the head repository (a fork,
        # for a fork PR), and GITHUB_SHA is the ephemeral merge commit rather than
        # anything raw.githubusercontent.com will serve. Pass both through so
        # tools/model-base-url.sh can pin the real commit. Empty on push builds,
        # where GITHUB_REPOSITORY and GITHUB_SHA are already right.
        GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash build_examples.sh

    - name: upload complete example build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: example-build-log
        path: build-examples.log
        if-no-files-found: warn
        retention-days: 7

    - name: stage pages assets
      run: |
        site_dir="$(bash tools/stage-site-assets.sh)"
        echo "PUBLISH_DIR=${site_dir}" >> "$GITHUB_ENV"
        ls -la "${site_dir}" | sed -n '1,200p'

    - name: verify published model artifacts
      run: |
        set -euo pipefail

        site_dir="${PUBLISH_DIR:?PUBLISH_DIR was not set by stage step}"
        test -f "${site_dir}/index.html"
        root_count=$(find "${site_dir}" -maxdepth 1 -type f \( -name '*.ttl' -o -name '*.jsonld' \) | wc -l | tr -d ' ')
        models_count=$(find "${site_dir}/models" -maxdepth 1 -type f \( -name '*.ttl' -o -name '*.jsonld' \) | wc -l | tr -d ' ')
        compiled_count=$(find "${site_dir}/compiled" -maxdepth 1 -type f -name '*.ttl' | wc -l | tr -d ' ')
        withimports_count=$(find "${site_dir}/withimports" -maxdepth 1 -type f -name '*.ttl' | wc -l | tr -d ' ')

        echo "root model files: ${root_count}"
        echo "models/ files: ${models_count}"
        echo "compiled/ files: ${compiled_count}"
        echo "withimports/ files: ${withimports_count}"

        [ "${root_count}" -gt 0 ]
        [ "${models_count}" -gt 0 ]
        [ "${compiled_count}" -gt 0 ]
        [ "${withimports_count}" -gt 0 ]

        sample_path="$(find models -maxdepth 1 -type f -name '*.ttl' | head -n 1)"
        if [ -z "${sample_path}" ]; then
          echo "No source .ttl files found under models/"
          exit 1
        fi
        sample_file="${sample_path##*/}"
        test -f "${site_dir}/${sample_file}"
        test -f "${site_dir}/models/${sample_file}"
        test -f "${site_dir}/compiled/${sample_file}"
        test -f "${site_dir}/withimports/${sample_file}"

    # Push the book's HTML to github-pages
    - name: GitHub Pages action
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ${{ env.PUBLISH_DIR }}
